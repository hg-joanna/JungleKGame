<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle King</title>
    <script src="https://cjrtnc.leaningtech.com/latest/loader.js"></script>
</head>
<body style="margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <script>
        async function runGame() {
            try {
                await cheerpjInit();
                cheerpjCreateDisplay(1300, 900);
                // Pass the absolute path to the jar
                await cheerpjRunJar("/app/JungleKing.jar");
            } catch (err) {
                console.error("CheerpJ execution error:", err);
            }
        }

        runGame();
    </script>
</body>
</html>
