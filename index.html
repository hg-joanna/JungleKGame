<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jungle King</title>

    <script src="https://cjrtnc.leaningtech.com/latest/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script>

async function Java_GameWebSocketClient_connectNative(
    lib,
    self
) {

    console.log(
        "Java requested WebSocket connection."
    );

    const socket =
        new WebSocket(
            "wss://junglekgame.onrender.com/"
        );

    socket.onopen = function () {

        console.log(
            "Browser WebSocket connected."
        );

        lib.GameWebSocketClient.setConnected(
            self,
            true
        );
    };

    socket.onerror = function () {

        console.log(
            "Browser WebSocket error."
        );

        lib.GameWebSocketClient.setConnected(
            self,
            false
        );
    };

    socket.onclose = function () {

        console.log(
            "Browser WebSocket closed."
        );

        lib.GameWebSocketClient.setConnected(
            self,
            false
        );
    };
}


async function Java_GameWebSocketClient_sendCreateRoomNative(
    lib,
    self,
    playerName
) {

    console.log(
        "Create room requested from Java."
    );

    console.log(
        playerName
    );
}


async function Java_GameWebSocketClient_sendJoinRoomNative(
    lib,
    self,
    roomCode,
    playerName
) {

    console.log(
        "Join room requested from Java."
    );

    console.log(
        roomCode
    );

    console.log(
        playerName
    );
}


(async function () {

    console.log(
        "CheerpJ is initializing"
    );

    await cheerpjInit({
        version: 11,

        natives: {

            Java_GameWebSocketClient_connectNative,

            Java_GameWebSocketClient_sendCreateRoomNative,

            Java_GameWebSocketClient_sendJoinRoomNative

        }
    });

    console.log(
        "CheerpJ runtime ready"
    );

    cheerpjCreateDisplay(
        1300,
        900
    );

    cheerpjRunMain(
        "HomePageGUI",
        "/app/JungleKing.jar"
    );

})();
</script>

</body>
</html>
