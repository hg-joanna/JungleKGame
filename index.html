
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jungle King</title>

    <script src="https://cjrtnc.leaningtech.com/latest/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script>

var jungleSocket = null;

function connectJungleServer() {

    console.log("Connecting to Jungle King server...");

    jungleSocket = new WebSocket(
        "wss://junglekgame.onrender.com/"
    );

    jungleSocket.onopen = function () {

        console.log(
            "Jungle King WebSocket connected."
        );

        window.jungleSocketConnected = true;
    };

    jungleSocket.onmessage = function (event) {

        console.log(
            "Server message:"
        );

        console.log(
            event.data
        );

        window.jungleSocketMessage =
            event.data;
    };

    jungleSocket.onerror = function (error) {

        console.log(
            "Jungle King WebSocket error."
        );

        console.log(
            error
        );
    };

    jungleSocket.onclose = function () {

        console.log(
            "Jungle King WebSocket closed."
        );

        window.jungleSocketConnected = false;
    };
}

function sendJungleMessage(message) {

    console.log(
        "Sending to server:"
    );

    console.log(
        message
    );

    if (
        jungleSocket != null
        && jungleSocket.readyState === WebSocket.OPEN
    ) {

        jungleSocket.send(
            message
        );

        return true;
    }

    console.log(
        "WebSocket is not connected."
    );

    return false;
}

(async function () {

    console.log(
        "CheerpJ is initializing"
    );

    await cheerpjInit({
        version: 11
    });

    console.log(
        "CheerpJ runtime ready"
    );

    connectJungleServer();

    cheerpjCreateDisplay(
        1300,
        900
    );

    cheerpjRunMain(
        "HomePageGUI",
        "/app/JungleKing.jar"
    );

})();
</script>

</body>
</html>
