
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jungle King</title>

    <script src="https://cjrtnc.leaningtech.com/latest/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script>

(async function () {

    console.log(
        "CheerpJ is initializing"
    );

    await cheerpjInit({
        version: 11,

        natives: {

            "GameWebSocketClient.nativeConnect":
                function (client) {

                    console.log(
                        "Opening Render WebSocket..."
                    );

                    var socket =
                        new WebSocket(
                            "wss://junglekgame.onrender.com/"
                        );

                    window.jungleKingSocket =
                        socket;

                    socket.onopen =
                        function () {

                            console.log(
                                "Render WebSocket connected."
                            );

                            client.onConnected();
                        };

                    socket.onmessage =
                        function (event) {

                            console.log(
                                "Render message:",
                                event.data
                            );

                            client.onMessage(
                                event.data
                            );
                        };

                    socket.onerror =
                        function (error) {

                            console.log(
                                "Render WebSocket error.",
                                error
                            );

                            client.onConnectionFailed();
                        };

                    socket.onclose =
                        function () {

                            console.log(
                                "Render WebSocket closed."
                            );
                        };
                },

            "GameWebSocketClient.nativeSend":
                function (
                    client,
                    message
                ) {

                    console.log(
                        "Sending to Render:",
                        message
                    );

                    if (
                        window.jungleKingSocket
                        && window.jungleKingSocket.readyState
                            === WebSocket.OPEN
                    ) {

                        window.jungleKingSocket.send(
                            message
                        );

                    } else {

                        console.log(
                            "WebSocket is not open."
                        );
                    }
                }
        }
    });

    console.log(
        "CheerpJ runtime ready"
    );

    cheerpjCreateDisplay(
        1300,
        900
    );

    cheerpjRunMain(
        "HomePageGUI",
        "/app/JungleKing.jar"
    );

})();
</script>

</body>
</html>
