<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jungle King</title>

    <script src="https://cjrtnc.leaningtech.com/latest/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>

<body>

<script>
(async function () {

    console.log("CheerpJ is initializing");

    await cheerpjInit({
        version: 11
    });

    console.log("CheerpJ runtime ready");

    cheerpjCreateDisplay(
        1300,
        900
    );

    cheerpjRunMain(
        "HomePageGUI",
        "/app/JungleKing.jar"
    );

})();
</script>

</body>
</html>
